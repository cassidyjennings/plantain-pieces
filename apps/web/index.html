<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is a prerequisite for env(safe-area-inset-*) to resolve to non-zero
         values on iOS -- without it, the fixed top bar / tray dock have no way to know how much
         to pad clear of a notch or the home-indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches site.webmanifest's theme_color -- Chrome/Android reads this tag directly rather
         than always resolving it from the manifest. -->
    <meta name="theme-color" content="#0a1710" />
    <!-- site.webmanifest already sets display:standalone, but iOS Safari doesn't honor that from
         the manifest alone -- Add to Home Screen needs these Apple-specific tags too, or the game
         opens inside Safari's own chrome (URL bar and all) instead of as a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Plantain Pieces</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
